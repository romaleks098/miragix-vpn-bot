name: Update Bot Info

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/set_commands.py'
      - 'scripts/update_bot_info.py'

jobs:
  update_info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update_bot_info and set_commands
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python scripts/update_bot_info.py
          python scripts/set_commands.py
