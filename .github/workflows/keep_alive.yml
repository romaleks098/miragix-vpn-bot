name: Automated Keep Alive

on:
  schedule:
    # Запуск каждые 14 минут силами самого GitHub (без сторонних сервисов)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -m 15 https://miragix-vpn-bot.onrender.com/health || true
